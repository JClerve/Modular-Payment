name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SettleCore.slnx

      - name: Build
        run: dotnet build SettleCore.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SettleCore.slnx --configuration Release --no-build --verbosity normal